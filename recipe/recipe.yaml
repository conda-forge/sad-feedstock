schema_version: 1

context:
  version: "0.4.33"

package:
  name: sad
  version: ${{ version }}

source:
  url: https://github.com/ms-jpq/sad/archive/v${{ version }}.tar.gz
  sha256: ec2b533aaa6c39b4f87d6154854ead4fc381fc9fc9b727b2fc82e6ec4f7c1d8b

build:
  number: 0

requirements:
  build:
    - ${{ compiler('rust') }}
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - cargo-bundle-licenses

tests:
  - script:
      - sad --help

about:
  license: MIT
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  summary: CLI search and replace | Space Age seD
  homepage: https://github.com/ms-jpq/sad
  repository: https://github.com/ms-jpq/sad

extra:
  recipe-maintainers:
    - danielnachun
